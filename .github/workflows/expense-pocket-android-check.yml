name: Expense Pocket Android prototype
on:
  pull_request:
    paths:
      - 'expense-pocket-android/**'
      - 'expense-pocket-web/**'
      - '.github/workflows/expense-pocket-android-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug :app:bundleRelease
        working-directory: expense-pocket-android
      - uses: actions/upload-artifact@v4
        with:
          name: expense-pocket-android-builds-NOT-PLAY-SIGNED
          path: |
            expense-pocket-android/app/build/outputs/apk/debug/*.apk
            expense-pocket-android/app/build/outputs/bundle/release/*.aab
