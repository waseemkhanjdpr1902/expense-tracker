plugins { id 'com.android.application' }
android {
    namespace 'com.waseemkhanjdpr1902.expensepocket'
    compileSdk 36
    defaultConfig {
        applicationId 'com.waseemkhanjdpr1902.expensepocket'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyWebsite', Copy) {
    from '../../expense-pocket-web'
    into layout.buildDirectory.dir('generated/assets/website')
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
tasks.named('preBuild').configure { dependsOn tasks.named('copyWebsite') }
